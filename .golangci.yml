version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gochecknoglobals
    - gochecknoinits
    - gosec
    - misspell
    - noctx
    - sloglint
    - testifylint
  exclusions:
    rules:
      # Table-driven tests commonly keep fixtures at package level.
      - path: _test\.go
        linters:
          - gochecknoglobals
    paths:
      # Generated by sqlc (internal/store/db). Never edited by hand.
      - internal/store/db

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/MagnunAVF/heimdall-actions
  exclusions:
    paths:
      - internal/store/db
