name: Claude PR review
on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@12732ed86c7c48cf319dc8c528fa0b24c81c3486 # v1.0.249
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow CLAUDE.md and .claude/agents/reviewer.md. Refer to issues as ENG-<n>.
            Post one summary comment with Blocking / Should fix / Nits using `gh pr comment`.
          claude_args: '--allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
